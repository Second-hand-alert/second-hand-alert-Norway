<!DOCTYPE html>
  <head>
    <title>test</title>
  </head>
  <body>
    <!-- trigger pageview -->
    <script>
      let prodObj = {
        type: 'CONTENT_BACKGROUND',
        title: '',
        queryPartReadable: '',
        URL: 'https://www.finn.no/bap/forsale/search.html?category=0.78&q=EKTORP+2-seters+sofa&sort=PRICE_ASC&for_rent=0&trade_type=1&trade_type=2',
        searchSite: 'FINN',
        searchResults: null
      }
      let regexes = {
        FINN: /(?<=<meta name="description" content="Du finner )\d+/gmu
      }
      prodArr=[]
      function productSearch(prodObj) {
        // hello FINN search
        console.log(prodObj.URL)
        fetch(prodObj.URL)
          .then(response => {
            // When the page is loaded convert it to text
            return response.text()
          })
          .then(html => {
            let hits = regexes.FINN.exec(html)
            console.log('Hits: ' + hits)
            prodObj.searchResults =  hits[0]
            console.log(prodObj.searchResults)
            // Notify if results
            prodArr.push(prodObj)
            console.log(JSON.stringify(prodArr, null, ' '))
          })
          .catch(error => {
            console.error('Failed to fetch ' + prodObj.searchSite + ' page: ', error)
          })
      }
      productSearch(prodObj)
    </script>
  </body>
</html>
